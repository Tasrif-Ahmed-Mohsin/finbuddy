# Bangladeshi bank CNY transfer pricing.
#
# The MID-MARKET rate is REAL (live, see app/fx.py). Bank prices below are a markup over the live
# mid-market rate plus a fixed fee. Real quotes can also be entered (POST /market/quotes).
#
# Calibration (2026-10-13): one REAL payment from our interviewee: BRAC Bank, 35,200 CNY tuition at
# 18.35 BDT/CNY (late Aug / Sep 2026). The mid-market rate then averaged 18.31 (range 18.09–18.44), so BRAC's
# rate was only ~+0.2% over mid-market (between −0.5% and +1.4% depending on the exact day). The
# ~8,000 BDT Student File charge seen on that payment was the bigger cost. The generic estimates were
# therefore lowered from 1.5–3.0% to 0.6–1.8%.

source: "Estimated: markup over the live mid-market rate (not a real bank quote)"

estimated_quotes:
  - quote_id: "brac-field"
    bank: "BRAC Bank (from 1 real payment, Sep 2026)"
    markup_pct: "0.22"     # 18.35 vs average mid-market 18.31 (15 Aug–30 Sep 2026)
    fixed_fee_bdt: "8000"  # includes the Student File charge seen on that payment; repeat-transfer fee unknown
    source: "Field data: interviewee's real tuition payment (rate 18.35, ~8,000 BDT charge); exact date to confirm"
  - quote_id: "est-a"
    bank: "Bank A (estimate)"
    markup_pct: "1.0"      # TT selling rate vs mid-market
    fixed_fee_bdt: "1150"  # per transfer, VAT included
  - quote_id: "est-b"
    bank: "Bank B (estimate)"
    markup_pct: "1.8"
    fixed_fee_bdt: "800"
  - quote_id: "est-c"
    bank: "Bank C (estimate)"
    markup_pct: "0.6"
    fixed_fee_bdt: "1725"
