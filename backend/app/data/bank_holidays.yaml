# Days when banks cannot move a cross-border transfer.
#
#   BD side: the transfer is sent from the Student File at a Bangladeshi branch (closed Fri + Sat and on holidays).
#   CN side: the transfer is credited to the student's Chinese account on a business day (closed Sat + Sun and on holidays).
#
# confidence (same scale as the corridor rule pack):
#   official   = fixed-date public holiday set by law
#   secondary  = reported practice (news / bank notices); verify each year
#   assumption = estimated from the lunar calendar or past years. Both governments publish the exact days only
#                1–2 months ahead (Bangladesh cabinet holiday list; China State Council notice). Update when published.
# Not modelled yet: China's make-up working Saturdays (调休) and one-day religious holidays outside the main festivals.

reviewed: "2026-10-13"

weekends:
  BD: [4, 5]   # Friday, Saturday (Python weekday numbers, Monday = 0)
  CN: [5, 6]   # Saturday, Sunday

closures:
  # ---- Bangladesh --------------------------------------------------------------
  - {country: BD, name: "Durga Puja (Bijoya Dashami)", name_bn: "দুর্গাপূজা (বিজয়া দশমী)", name_zh: "杜尔加节", from: 2026-10-20, to: 2026-10-21, confidence: assumption,
     source: "Estimated from the Hindu lunar calendar (2026 has an extra month, so later than 2025's 2 Oct)"}
  - {country: BD, name: "Victory Day", name_bn: "বিজয় দিবস", name_zh: "孟加拉国胜利日", from: 2026-12-16, to: 2026-12-16, confidence: official, source: "Fixed national holiday"}
  - {country: BD, name: "Christmas", name_bn: "বড়দিন", name_zh: "圣诞节", from: 2026-12-25, to: 2026-12-25, confidence: official, source: "Fixed public holiday"}
