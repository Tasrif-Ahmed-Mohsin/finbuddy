     source: "Bangladesh Bank closes banks to the public on 31 December each year (news reports)"}
  - {country: BD, name: "Shaheed Day / International Mother Language Day", name_bn: "শহীদ দিবস ও আন্তর্জাতিক মাতৃভাষা দিবস", name_zh: "国际母语日", from: 2027-02-21, to: 2027-02-21,
