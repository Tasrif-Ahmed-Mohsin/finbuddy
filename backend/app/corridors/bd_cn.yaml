# Corridor rule pack: Bangladesh → China
#
# Every parameter carries:
#   value       the number the engines use
#   confidence  official | secondary | field | assumption | sample
#                 official   = regulator / government / university page
#                 secondary  = guide, blog, news, vendor (verify before relying on it)
#                 field      = our user interview (one student's experience)
#                 assumption = our estimate, no source yet (shown to users as "estimate")
#                 sample     = illustrative development value, NOT real data
#   source      where it came from (see docs/01_problem_research.md)
#   note        caveats
#
# The app must show an "estimate" badge for anything that is not `official`.

id: BD-CN
name: "Bangladesh → China"
home_currency: BDT
host_currency: CNY
vehicle_currency: USD
reviewed: "2026-10-16"

params:
  # ---- Bangladesh side -------------------------------------------------------
  bd_living_remit_cap_usd_per_month:
    value: 2000
    confidence: secondary
    source: "FE Circular No. 37 (2025) via legalseba.com/bd-articles/?p=1125"
    note: "+50% for high-cost locations with proof. Circular reportedly valid until 2026-09-29; re-verify."

  bd_incidental_once_usd:
    value: 1000
    confidence: secondary
    source: "FE Circular No. 37 (2025) via legalseba.com"
    note: "One-time, newly admitted students."

  bd_student_card_cap_bdt_per_month:
    value: 500000
    confidence: field
    source: "Interview #1 (2026-10-12)"
    note: "Assumed to be the Bangladeshi student card/account; confirm which account and whether remittances count."

  bd_student_card_tx_cap_per_month:
    value: 30
    confidence: field
    source: "Interview #1 (2026-10-12)"
    note: "Unclear whether card purchases count or only ATM withdrawals; we count both (conservative)."

  bd_card_atm_fixed_fee_bdt:
    value: 345
    confidence: field
    source: "Interview #1 (2026-10-12)"
    note: "~USD 2.8; consistent with a fixed fee + VAT. Verify in the bank's schedule of charges."

  bd_card_atm_daily_cap_usd:
    value: 300
    confidence: secondary
    source: "Financial Express report on BRAC debit cards abroad (undated)"

  bd_card_atm_monthly_cap_usd:
    value: 1500
    confidence: secondary
    source: "Financial Express report on BRAC debit cards abroad (undated)"

  bd_card_non_usd_factor_pct:
    value: 3.0
    confidence: secondary
    source: "BRAC Bank card schedule of charges 2019"
    note: "'Foreign currency factor' on non-USD transactions; may be outdated."

  bd_card_fx_markup_pct:
    value: 1.0
    confidence: assumption
    source: "Our estimate of card-network + issuer rate vs mid-market"
    note: "Replace with a real card statement."

  bd_tt_transfer_days:
    value: 7
    confidence: field
    source: "Interview #1: BRAC Bank CNY tuition transfer arrived in ~1 week"

  bd_student_file_fee_bdt:
    value: 8000
    confidence: field
    source: "Interview #1 (2026-10-12)"
    note: "One-time vs recurring unclear. Other banks list renewal Tk 4,500–6,000 + VAT per year."

  bd_endorsement_warn_days:
    value: 21
    confidence: assumption
    source: "Product choice: warn three weeks before the endorsement or Student File expires"

  renewal_university_doc_days:
    value: 7
    confidence: assumption
    source: "Our estimate for a stamped enrolment certificate + transcript from an international office"
    note: "Ask the friend how long their university takes."

  renewal_scan_send_days:
    value: 2
    confidence: assumption
    source: "Time to scan and send the documents to the parent in Bangladesh"

  renewal_bank_processing_days:
    value: 3
    confidence: assumption
    source: "Our estimate for the bank to process a Student File renewal / endorsement"

  renewal_buffer_days:
    value: 5
    confidence: assumption
    source: "Product choice: finish the renewal five days before the old one expires"

  endorsement_renewal_in_person:
    value: 1
    confidence: field
    source: "Interview #1 follow-up (2026-10-13): the student must go to the bank, because renewal needs the passport"
    note: "1 = yes. A student in China cannot renew the card endorsement until the next visit home."

  # ---- Year plan / autopilot (docs: TECHNICAL_DOCUMENTATION.md, year plan) -------
  living_safety_days:
    value: 5
    confidence: assumption
    source: "Product choice: when a transfer lands, keep at least 5 days of money as a cushion for delays"

  transfer_late_margin_days:
    value: 3
    confidence: assumption
    source: "Product choice: plan as if the next transfer could be up to 3 days late (correspondent banks, compliance checks). With the 5-day cushion this matters only when a late arrival would run into a Chinese bank closure"

  living_target_days:
    value: 30
    confidence: assumption
    source: "Product choice: each living-money transfer covers about a month (one fixed fee per month)"

  min_living_transfer_cny:
    value: 1000
    confidence: assumption
    source: "Product choice: no tiny transfers (each one pays a fixed bank fee)"

  baseline_reorder_days:
    value: 7
    confidence: assumption
    source: "Our model of a careful family today: they send money when about a week is left, because a transfer takes a week"

  atm_low_cash_days:
    value: 2
    confidence: assumption
    source: "Our model of a student today: withdraws cash at an ATM when about 2 days of money are left"

  # ---- China side ------------------------------------------------------------
  cn_atm_foreign_card_fee_cny:
    value: 25
    confidence: secondary
    source: "Travel guides / forum reports (20–30 CNY at big state banks)"

  cn_atm_max_per_withdrawal_cny:
    value: 3000
    confidence: secondary
    source: "Travel guides / forum reports (2,500–5,000 CNY at big state banks)"

  cn_alipay_foreign_card_fee_pct:
    value: 3.0
    confidence: secondary
    source: "WentChina 2026 guide; travel guides"
    note: "Charged on single payments above cn_alipay_fee_threshold_cny."

  cn_alipay_fee_threshold_cny:
    value: 200
    confidence: secondary
    source: "WentChina 2026 guide; travel guides"

  cn_fx_annual_quota_usd:
    value: 50000
    confidence: official
    source: "HSBC China personal FX guide; SAFE 2010 notice"
    note: "Non-mainland individuals; supporting documents needed above it."

  cn_outward_verify_threshold_cny:
    value: 5000
    confidence: secondary
    source: "Sinoblawg on rules effective 2026-01-01 (Art. 34)"

  cn_cash_declare_cny:
    value: 20000
    confidence: official
    source: "Shanghai customs clearance guide (GACC)"

  cn_cash_declare_usd:
    value: 5000
    confidence: official
    source: "Shanghai customs clearance guide (GACC)"

  # ---- Earn & Save: the student's own money in China (Interview #2, docs N-11 … N-14) ----
  cn_work_permission_required:
    value: 1
    confidence: official
    source: "Exit and Entry Administration Law Art. 43: a student working outside the work-study rules (no approval, other job or more hours than approved) is working illegally. Explained on university pages (Shenzhen University, BFSU) and Peking University ISD"
    note: "1 = a student needs university approval + a work-study annotation on the residence permit before any job."

  cn_work_hours_week_term:
    value: 8
    confidence: secondary
    source: "Student guides (2026): 8 h a week / 40 h a month in term time; another guide says 20 h a week. Sathi warns at the stricter number"
    note: "Sources conflict. The university's approval letter decides; ask the international student office."

  cn_illegal_work_fine_cny_min:
    value: 5000
    confidence: official
    source: "Exit and Entry Administration Law Art. 80 (as quoted by university and law-firm pages)"
    note: "Fine for the foreigner who works illegally; 5–15 days' detention when serious, and the visa can be cancelled."

  cn_illegal_work_fine_cny_max:
    value: 20000
    confidence: official
    source: "Exit and Entry Administration Law Art. 80 (as quoted by university and law-firm pages)"

  shield_target_days:
    value: 30
    confidence: assumption
    source: "Product choice: the suggested Shield is about a month of living money"

  shield_cooling_off_hours:
    value: 24
    confidence: assumption
    source: "Product choice: taking Shield money out for anything except an emergency waits a day (a commitment device, and 'pay right now' scams cannot reach it)"

  crisis_weeks:
    value: 4
    confidence: assumption
    source: "Product choice for the stress scenario: banks send no student transfers for 4 weeks. In the 2022–24 dollar shortage many banks stopped Student Files for much longer (research P-01)"

  hundi_premium_bdt_per_usd:
    value: 1.5
    confidence: field
    source: "Interview #2 (2026-10-16): 'illegal e dollar proti 1/2 ta loss jay' (1–2 taka lost per dollar by hundi)"
    note: "One student's experience; the premium moves with the dollar market."

  # ---- Product safety settings -----------------------------------------------
  two_person_threshold_bdt:
    value: 100000
    confidence: assumption
    source: "Product choice: payments of 1 lakh BDT or more need student AND parent approval"

  quote_max_age_minutes:
    value: 60
    confidence: assumption
    source: "Product choice: an approval is only valid for a fresh rate quote"

  large_debit_alert_bdt:
    value: 50000
    confidence: assumption
    source: "Product choice: ask 'was this you?' for debits of 50,000 BDT or more not started in Sathi"

  tuition_buffer_days:
    value: 3
    confidence: assumption
    source: "Product choice: safety buffer before the university deadline"

# Words that must never appear in a transfer note (banks' risk controls flag them; see P-16).
blocked_memo_terms: ["bitcoin", "btc", "usdt", "tether", "crypto", "doge", "eth", "虚拟货币", "比特币", "泰达币"]
