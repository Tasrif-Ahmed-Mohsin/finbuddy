<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .h { font-size: 18.5px; font-weight: 700; fill: #0E1324; }
    .b { font-size: 15px; fill: #3A4256; }
    .n { font-size: 17px; font-weight: 800; fill: #FFFFFF; }
    .k { font-size: 13.5px; font-weight: 700; letter-spacing: 1.5px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F7BEA"/></marker>
  </defs>
  <rect width="960" height="430" fill="#FFFFFF"/>
  <!-- row 1 -->
  <g>
    <rect x="20" y="20" width="290" height="180" rx="14" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.5"/>
    <circle cx="50" cy="52" r="17" fill="#1F7BEA"/><text x="50" y="58" class="n" text-anchor="middle">1</text>
    <text x="78" y="58" class="k" fill="#1F7BEA">THE FATHER, IN BANGLA</text>
    <text x="38" y="94" class="h">Says the rule once</text>
    <text x="38" y="122" class="b">“প্রতি মাসে ১ লাখ ২০ হাজার টাকা</text>
    <text x="38" y="144" class="b">পর্যন্ত ছেলের চীনের অ্যাকাউন্টে পাঠাবে”</text>
    <text x="38" y="176" class="b">voice or typing; no form to fill in</text>

    <rect x="335" y="20" width="290" height="180" rx="14" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.5"/>
    <circle cx="365" cy="52" r="17" fill="#1F7BEA"/><text x="365" y="58" class="n" text-anchor="middle">2</text>
    <text x="393" y="58" class="k" fill="#1F7BEA">COMPILE</text>
    <text x="353" y="94" class="h">Words become limits</text>
    <text x="353" y="122" class="b">rules parser (lakh, Bengali digits)</text>
    <text x="353" y="144" class="b">AI may help; its numbers must be in</text>
    <text x="353" y="166" class="b">the text · policy fixes payee, kind,</text>
    <text x="353" y="188" class="b">caps, expiry; injection refused</text>

    <rect x="650" y="20" width="290" height="180" rx="14" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.5"/>
    <circle cx="680" cy="52" r="17" fill="#1F7BEA"/><text x="680" y="58" class="n" text-anchor="middle">3</text>
    <text x="708" y="58" class="k" fill="#1F7BEA">READ BACK</text>
    <text x="668" y="94" class="h">Exact terms, read aloud</text>
    <text x="668" y="122" class="b">template in bn / en / zh (never AI)</text>
    <text x="668" y="144" class="b">“up to ৳1,20,000 a month, only to</text>
    <text x="668" y="166" class="b">his own account in China, until …”</text>
    <text x="668" y="188" class="b">proposal hash = exactly these fields</text>
  </g>
  <g stroke="#1F7BEA" stroke-width="2.2">
    <line x1="310" y1="110" x2="333" y2="110" marker-end="url(#a)"/>
    <line x1="625" y1="110" x2="648" y2="110" marker-end="url(#a)"/>
    <path d="M795 200 V215 H165 V228" fill="none" marker-end="url(#a)"/>
  </g>
  <!-- row 2 -->
  <g>
    <rect x="20" y="232" width="290" height="180" rx="14" fill="#E8F7EF" stroke="#7FD1A8" stroke-width="1.5"/>
    <circle cx="50" cy="264" r="17" fill="#17A36B"/><text x="50" y="270" class="n" text-anchor="middle">4</text>
    <text x="78" y="270" class="k" fill="#0F7A4B">SIGN</text>
    <text x="38" y="306" class="h">Two fingerprints</text>
    <text x="38" y="334" class="b">from ৳1 lakh, father and son both</text>
    <text x="38" y="356" class="b">sign the hash with their passkeys;</text>
    <text x="38" y="378" class="b">server checks origin, UV, replay,</text>
    <text x="38" y="400" class="b">counter · the agent can never sign</text>

    <rect x="335" y="232" width="290" height="180" rx="14" fill="#E8F7EF" stroke="#7FD1A8" stroke-width="1.5"/>
    <circle cx="365" cy="264" r="17" fill="#17A36B"/><text x="365" y="270" class="n" text-anchor="middle">5</text>
    <text x="393" y="270" class="k" fill="#0F7A4B">AUTOPILOT, EVERY DAY</text>
    <text x="353" y="306" class="h">Sends early, never more</text>
    <text x="353" y="334" class="b">look-ahead rule over both bank</text>
    <text x="353" y="356" class="b">calendars · fits the caps · drafts as</text>
    <text x="353" y="378" class="b">the agent so every check runs ·</text>
    <text x="353" y="400" class="b">asks the family when it doesn't fit</text>

    <rect x="650" y="232" width="290" height="180" rx="14" fill="#F3EEFF" stroke="#B9A3E6" stroke-width="1.5"/>
    <circle cx="680" cy="264" r="17" fill="#8E5BD8"/><text x="680" y="270" class="n" text-anchor="middle">6</text>
    <text x="708" y="270" class="k" fill="#6B3FC0">PROVE</text>
    <text x="668" y="306" class="h">Receipt and log</text>
    <text x="668" y="334" class="b">who allowed it (the mandate and its</text>
    <text x="668" y="356" class="b">signers) · bank tracking number ·</text>
    <text x="668" y="378" class="b">balanced books · hash-chained log ·</text>
    <text x="668" y="400" class="b">“why now” in the family feed</text>
  </g>
  <g stroke="#1F7BEA" stroke-width="2.2">
    <line x1="310" y1="322" x2="333" y2="322" marker-end="url(#a)"/>
    <line x1="625" y1="322" x2="648" y2="322" marker-end="url(#a)"/>
  </g>
</svg>
